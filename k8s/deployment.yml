apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cdc-trigger
  name: cdc-trigger
  namespace: kube-middleware
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cdc-trigger
  template:
    metadata:
      labels:
        app: cdc-trigger
    spec:
      containers:
        - env:
            # Consumed by the ${VAR} references in /app/config.yml. A value that
            # should be a list (e.g. source.mysql.exclude_table_regex) has to be
            # written in the configuration file, it cannot come from here.
            - name: SOURCE_MYSQL_ADDR
              value: '127.0.0.1:3306'
            - name: SOURCE_MYSQL_USER
              value: root
            - name: SOURCE_MYSQL_PASSWORD
              value: '123456'
          image: zhiqiangwang/app:cdc-trigger
          imagePullPolicy: Always
          name: cdc-trigger
          resources:
            limits:
              cpu: '1'
              memory: 500Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
