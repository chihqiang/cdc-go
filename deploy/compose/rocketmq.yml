# docker-compose -f deploy/compose/rocketmq.yml up -d
# docker-compose -f deploy/compose/rocketmq.yml down
services:
  mysql:
    image: mysql:8.0
    container_name: cdc-go-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: cdcgo
      TZ: Asia/Shanghai
    volumes:
      - ./:/cdc-go
    networks:
      - cdc-go-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rocketmq-nameserver:
    image: apache/rocketmq:4.9.7
    container_name: cdc-go-rocketmq-nameserver
    networks:
      - cdc-go-network
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: "-Duser.timezone=Asia/Shanghai"
    command: sh mqnamesrv
    healthcheck:
      test: [ "CMD-SHELL", "nc -z -w 3 localhost 9876" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: cdc-go-rocketmq-broker
    networks:
      - cdc-go-network
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT: "-Duser.timezone=Asia/Shanghai"
      NAMESRV_ADDR: rocketmq-nameserver:9876
      BROKER_ID: 0
      BROKER_CLUSTER_NAME: DefaultCluster
      BROKER_NAME: broker-a
    volumes:
      # brokerIP1 = 127.0.0.1, so that a cdc-go running on the host is told
      # to reach the broker through the published port instead of through an
      # address that only exists inside the compose network.
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      - rocketmq-nameserver
    command: sh mqbroker -n rocketmq-nameserver:9876 -c /home/rocketmq/broker.conf autoCreateTopicEnable=true
    healthcheck:
      test: [ "CMD-SHELL", "nc -z -w 3 localhost 10911" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
networks:
  cdc-go-network:
    driver: bridge