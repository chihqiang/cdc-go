# Broker configuration for the single-node RocketMQ that
# deploy/compose/rocketmq.yml and deploy/compose/services.yml start.
#
# brokerIP1 is the address the broker publishes in its route, which is what a
# client is told to connect to. Left unset, the broker advertises the address it
# reads from its own network interface, which is its address inside the compose
# network -- reachable by the other containers, but not by a cdc-trigger running
# on the host. 127.0.0.1 is the host side of the published port, so a client
# outside the network reaches the broker through it.
#
# A client inside the compose network would be given 127.0.0.1 instead, which
# points at itself, so a containerized cdc-trigger has to be pointed at the
# broker by service name (rocketmq-broker:10911) rather than through this route.
#
# The rest matches the broker.conf the image ships.

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
