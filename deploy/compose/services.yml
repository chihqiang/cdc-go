# docker-compose -f deploy/compose/services.yml up -d
# docker-compose -f deploy/compose/services.yml down
services:
  mysql:
    image: mysql:8.0
    container_name: cdc-trigger-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: cdctrigger
      TZ: Asia/Shanghai
    volumes:
      - ./:/cdc-trigger
    networks:
      - cdc-trigger-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:5
    container_name: cdc-trigger-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    networks:
      - cdc-trigger-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cdc-trigger-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    networks:
      - cdc-trigger-network
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    container_name: cdc-trigger-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Shanghai
      # Single node KRaft: this broker is also the controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # EXTERNAL is what cdc-trigger on the host connects to, PLAINTEXT is only
      # used by the broker healthcheck below
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # One broker, so every internal topic has to be replicated once
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - cdc-trigger-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  pulsar:
    image: apachepulsar/pulsar:4.1.1
    container_name: cdc-trigger-pulsar
    networks:
      - cdc-trigger-network
    ports:
      - "6650:6650"
      - "8080:8080"
    command: bin/pulsar standalone
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/admin/v2/brokers || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rocketmq-nameserver:
    image: apache/rocketmq:4.9.7
    container_name: cdc-trigger-rocketmq-nameserver
    networks:
      - cdc-trigger-network
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: "-Duser.timezone=Asia/Shanghai"
    command: sh mqnamesrv
    healthcheck:
      test: [ "CMD-SHELL", "nc -z -w 3 localhost 9876" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: cdc-trigger-rocketmq-broker
    networks:
      - cdc-trigger-network
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT: "-Duser.timezone=Asia/Shanghai"
      NAMESRV_ADDR: rocketmq-nameserver:9876
      BROKER_ID: 0
      BROKER_CLUSTER_NAME: DefaultCluster
      BROKER_NAME: broker-a
    volumes:
      # brokerIP1 = 127.0.0.1, so that a cdc-trigger running on the host is told
      # to reach the broker through the published port instead of through an
      # address that only exists inside the compose network.
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      - rocketmq-nameserver
    command: sh mqbroker -n rocketmq-nameserver:9876 -c /home/rocketmq/broker.conf autoCreateTopicEnable=true
    healthcheck:
      test: [ "CMD-SHELL", "nc -z -w 3 localhost 10911" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


networks:
  cdc-trigger-network:
    driver: bridge