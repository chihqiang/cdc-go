# kubectl apply -f deploy/k8s/kafka.yml
#
# Single node KRaft broker, the same layout as deploy/compose/kafka.yml: this
# broker is also the controller, so no ZooKeeper is needed.
# In cluster address: kafka.kube-middleware:9092
#
# StatefulSet because the log directory is bound to the broker identity
# (meta.properties holds the node id and the cluster id) and to the volume.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kafka-broker
  # Single Service on purpose: it is both the governing service of the
  # StatefulSet (stable pod DNS name kafka-0.kafka.kube-middleware.svc) and the
  # in cluster client address (kafka.kube-middleware.svc:9092). A ClusterIP
  # service would duplicate the selector and add nothing for a single replica.
  name: kafka
  namespace: kube-middleware
spec:
  clusterIP: None
  # The broker is its own controller, so keep its address resolvable while it
  # bootstraps instead of waiting for readiness.
  publishNotReadyAddresses: true
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
  selector:
    app: kafka-broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: kafka-broker
  name: kafka
  namespace: kube-middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  serviceName: kafka
  # The PVC holds the KRaft metadata log, so keep it if this StatefulSet is
  # ever recreated (for example when changing an immutable field).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      # The apache/kafka image runs as uid 1000 (appuser).
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - name: CLUSTER_ID
              # Fixed cluster id: with persistent storage the log directory is
              # formatted once, a random id on every start would fail to match it.
              value: -tYpPzxDRSCUl224wCPXJQ
            - name: KAFKA_NODE_ID
              value: '1'
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              # Broker and controller share this pod, so the controller is
              # reached over loopback. Using the Service name would make the
              # pod resolve its own address while still bootstrapping, which
              # previously deadlocked (endpoints were only published after
              # readiness, and readiness needs the controller).
              value: 1@127.0.0.1:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            # Only the in cluster address is advertised: cdc-go runs in the
            # same cluster, no external listener is published. Reach the broker
            # from a laptop with `kubectl port-forward svc/kafka 9092:9092` and
            # add an EXTERNAL listener if the advertised address has to change.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            # Without this the image keeps its default log.dirs=/tmp/kafka-logs,
            # which is not the path the PVC is mounted at: the 20Gi volume stays
            # empty and every restart starts from a fresh metadata log. Point it
            # at a subdirectory instead of the mount root, because a freshly
            # formatted volume contains lost+found and Kafka refuses to start
            # when the log directory holds anything but topic data.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kafka
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            # One broker, so every internal topic can only be replicated once.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: '1'
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: '0'
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          volumeMounts:
            - mountPath: /var/lib/kafka/data
              name: data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
