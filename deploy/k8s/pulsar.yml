# kubectl apply -f deploy/k8s/pulsar.yml
#
# Standalone Pulsar (broker + BookKeeper + ZooKeeper in one process), the same
# layout as deploy/compose/pulsar.yml.
# In cluster addresses: pulsar.kube-middleware:6650 (binary protocol),
#                       pulsar.kube-middleware:8080 (admin/web service)
#
# StatefulSet because the BookKeeper ledgers and the embedded ZooKeeper
# snapshots live on the volume of one specific instance.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pulsar-broker
  # Single Service on purpose: it is both the governing service of the
  # StatefulSet (stable pod DNS name pulsar-0.pulsar.kube-middleware.svc) and
  # the in cluster client address pulsar.kube-middleware.svc:6650. One replica,
  # so a ClusterIP service would only duplicate the selector.
  name: pulsar
  namespace: kube-middleware
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: pulsar
      port: 6650
      targetPort: pulsar
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: pulsar-broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: pulsar-broker
  name: pulsar
  namespace: kube-middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar-broker
  serviceName: pulsar
  # The PVC holds the BookKeeper ledgers, so keep it if this StatefulSet is
  # ever recreated (for example when changing an immutable field).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: pulsar-broker
    spec:
      # The image runs as the pulsar user (uid 10000) and needs to write the
      # ledgers below /pulsar/data.
      securityContext:
        fsGroup: 10000
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:4.1.1
          command:
            - bin/pulsar
            - standalone
          env:
            # Broker, BookKeeper and ZooKeeper share this heap: keep the limit
            # well above the -Xmx below.
            - name: PULSAR_MEM
              value: -Xms512m -Xmx512m
          ports:
            - containerPort: 6650
              name: pulsar
            - containerPort: 8080
              name: http
          volumeMounts:
            - mountPath: /pulsar/data
              name: data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
